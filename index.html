function sound(ok){try{let clip=ok?bravoSound:oopsSound;clip.pause();clip.currentTime=0;clip.play().catch(()=>{});}catch(e){}}
function feedback(ok){$('feedback').textContent=ok?'🌟 Bravo! Great job! 👏':'💗 Oops! Try again!';$('feedback').className='feedback '+(ok?'good':'bad');sound(ok)}
function equation(t){return t.vertical?`<div class="vertical"><div>${t.a}</div><div class="plus">+ ${t.b}</div><div>?</div></div>`:`${t.a} + ${t.b} = ?`}
function blocks(n){let out='<div class="blocks">';for(let j=0;j<Math.floor(n/10);j++)out+=`<span class="ten" style="animation-delay:${j*55}ms"></span>`;for(let j=0;j<n%10;j++)out+=`<span class="one" style="animation-delay:${j*45}ms"></span>`;return out+'</div>'}
function render(){let t=tasks[i];selected=null;matchSelected=null;matched=new Set();matchLines=[];$('count').textContent=`Activity ${i+1} / ${tasks.length}`;$('bar').style.width=((i+1)/tasks.length*100)+'%';$('feedback').textContent='';$('activity').innerHTML='';$('next').textContent=i===tasks.length-1?'Finish 🎉':'Next ➜';$('back').disabled=i===0;
if(t.type==='pick'||t.type==='tf'||t.type==='drag'){
let heading=t.type==='tf'?'True or False?':t.type==='drag'?'Drag the correct answer into the box.':'Tap the correct answer.';
let q=t.type==='tf'?(t.vertical?`<div class="vertical"><div>${t.a}</div><div class="plus">+ ${t.b}</div><div>${t.shown}</div></div>`:`${t.a} + ${t.b} = ${t.shown}`):equation(t);
$('activity').innerHTML=`<div class="prompt">${heading}</div><div class="question">${q}</div><div class="small">Tap “Show blocks” to see moving tens and ones.</div><div style="text-align:center"><button class="btn secondary" id="showblocks">🧊 Show blocks</button></div><div id="blockview"></div><div class="answers" id="answers"></div>`;
$('showblocks').onclick=()=>{$('blockview').innerHTML='<div class="blockline">'+t.a+' = tens and ones</div>'+blocks(t.a)+'<div class="blockline">'+t.b+' = tens and ones</div>'+blocks(t.b)};
if(t.type==='tf'){[['True',t.a+t.b===t.shown],['False',t.a+t.b!==t.shown]].forEach(([label,ok])=>addChoice(label,()=>feedback(ok)))}
else if(t.type==='pick'){t.opts.forEach(v=>addChoice(v,()=>feedback(v===t.a+t.b)))}
else{$('answers').innerHTML='<div class="target" id="drop" tabindex="0">Drop here</div><div class="answers" id="tiles" style="width:100%"></div>';t.opts.forEach(v=>{let el=document.createElement('button');el.className='tile';el.textContent=v;el.draggable=true;el.onclick=()=>{selected=v;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')};el.ondragstart=e=>{selected=v;e.dataTransfer.setData('text/plain',String(v))};$('tiles').append(el)});let d=$('drop');d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();checkDrop(Number(e.dataTransfer.getData('text/plain')))};d.onclick=()=>{if(selected!==null)checkDrop(selected)};}
}else{renderMatching(t)}initDraw()}
function addChoice(label,cb){let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=cb;$('answers').append(b)}
function checkDrop(v){$('drop').textContent=v;let ok=v===tasks[i].a+tasks[i].b;feedback(ok);if(!ok)setTimeout(()=>{if($('drop')&&$('drop').textContent===String(v))$('drop').textContent='Drop here'},800)}
function renderMatching(t){let order=[2,0,1];let right=order.map(j=>t.pairs[j][0]+t.pairs[j][1]);$('activity').innerHTML='<div class="prompt">Tap a sum, then tap its answer to connect!</div><div class="matcharea" id="matcharea"><svg class="lines" id="lines"></svg><div class="matchcol" id="left"></div><div class="matchcol" id="right"></div></div><p class="small">The answers are mixed up. Correct matches draw a line automatically.</p>';t.pairs.forEach((p,j)=>{let b=document.createElement('button');b.className='matchbtn';b.textContent=`${p[0]} + ${p[1]}`;b.dataset.side='left';b.dataset.id=j;b.onclick=()=>matchClick('left',j,b);$('left').append(b)});right.forEach((v,j)=>{let b=document.createElement('button');b.className='matchbtn right';b.textContent=v;b.dataset.side='right';b.dataset.id=j;b.onclick=()=>matchClick('right',j,b);$('right').append(b)})}
function matchClick(side,j,el){if(matched.has(side+j))return;if(!matchSelected){matchSelected={side,j,el};el.classList.add('selected');return}let a=matchSelected; a.el.classList.remove('selected');matchSelected=null;if(a.side===side){matchSelected={side,j,el};el.classList.add('selected');return}let l=side==='left'?j:a.j,r=side==='right'?j:a.j;let rightOrder=[2,0,1],correct=tasks[i].pairs[l][0]+tasks[i].pairs[l][1]===tasks[i].pairs[rightOrder[r]][0]+tasks[i].pairs[rightOrder[r]][1];feedback(correct);if(correct){matched.add('left'+l);matched.add('right'+r);document.querySelector(`[data-side="left"][data-id="${l}"]`).classList.add('matched');document.querySelector(`[data-side="right"][data-id="${r}"]`).classList.add('matched');matchLines.push([l,r]);drawLines();if(matchLines.length===3){$('feedback').textContent='🎉 Bravo! All matched!'}}}
function drawLines(){let area=$('matcharea'),svg=$('lines');if(!area)return;let r=area.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';matchLines.forEach(([l,k])=>{let a=document.querySelector(`[data-side="left"][data-id="${l}"]`).getBoundingClientRect(),b=document.querySelector(`[data-side="right"][data-id="${k}"]`).getBoundingClientRect();let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.right-r.left);line.setAttribute('y1',a.top+a.height/2-r.top);line.setAttribute('x2',b.left-r.left);line.setAttribute('y2',b.top+b.height/2-r.top);line.setAttribute('stroke','#249c69');line.setAttribute('stroke-width','5');line.setAttribute('stroke-linecap','round');svg.append(line)})}
function initDraw(){let c=$('draw');let rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=3;ctx.strokeStyle='#244c9a';ctx.lineCap='round';ctx.lineJoin='round';c.onpointerdown=e=>{painting=true;c.setPointerCapture(e.pointerId);ctx.beginPath();let r=c.getBoundingClientRect();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};c.onpointermove=e=>{if(!painting)return;let r=c.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>painting=false;$('erase').onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
$('next').onclick=()=>{if(i<tasks.length-1){i++;render()}else{$('activity').innerHTML='<div class="finish">🎊 Amazing work!<div>You finished all 12 activities!</div>🌟👏🌟</div>';$('feedback').textContent='Bravo!';sound(true);$('next').disabled=true;$('draw').style.display='none'}};$('back').onclick=()=>{if(i>0){i--;render();$('next').disabled=false;$('draw').style.display='block'}};$('retry').onclick=()=>{i=0;$('next').disabled=false;$('draw').style.display='block';render()};window.addEventListener('resize',()=>{if(tasks[i].type==='match')drawLines()});render();
</script></body></html>
